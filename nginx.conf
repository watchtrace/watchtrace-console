map $http_x_forwarded_proto $watchtrace_forwarded_proto {
  "" $scheme;
  default $http_x_forwarded_proto;
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  # Resolve the private Compose service at request time. Keeping the API on the
  # internal Docker network gives the browser one HTTPS origin and exposes only
  # this frontend gateway through Coolify.
  resolver 127.0.0.11 valid=30s ipv6=off;
  set $watchtrace_api http://api:8080;

  location = /health {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  location ^~ /api/v1/ {
    proxy_pass $watchtrace_api$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $watchtrace_forwarded_proto;
    proxy_set_header Connection "";

    # Event streams are refresh hints and must reach the browser immediately.
    # The long timeout also covers ordinary authenticated SSE connections.
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    add_header X-Accel-Buffering no always;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
