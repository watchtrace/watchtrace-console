name: Frontend CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.12.0
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run test:contract
      - run: npm run build
      - run: npm run test:container
      - run: npm run test:browser
      - name: Check production deployment helpers
        run: |
          sh -n scripts/coolify-deploy.sh scripts/verify-production-deployment.sh
          ./scripts/test-coolify-deploy.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: watchtrace-console-v1.0.0
          path: dist/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish Linux AMD64 and ARM64 image to GHCR
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/watchtrace-console
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags and labels
        id: metadata
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6.0.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=main
            type=sha,format=long,prefix=sha-

      - name: Build and publish image
        id: publish
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=frontend-image
          cache-to: type=gha,mode=max,scope=frontend-image

      - name: Attest published image
        uses: actions/attest@c32b4b8b198b65d0bd9d63490e847ff7b53989d4 # v4.0.0
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true

      - name: Record immutable deployment reference
        env:
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          mkdir -p .release
          printf '%s\n' "$IMAGE_DIGEST" > .release/watchtrace-console.digest
          echo "${IMAGE_NAME}@${IMAGE_DIGEST}" >> "$GITHUB_STEP_SUMMARY"

      - name: Retain published image digest for the deploy job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-digest-watchtrace-console
          path: .release/watchtrace-console.digest
          if-no-files-found: error
          retention-days: 90

  deploy:
    name: Deploy frontend release to prod
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      vars.COOLIFY_DEPLOY_ENABLED == 'true'
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: prod
      url: ${{ vars.WATCHTRACE_PUBLIC_URL }}
    permissions:
      actions: read
      contents: read
    env:
      COOLIFY_API_URL: ${{ vars.COOLIFY_API_URL }}
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
      COOLIFY_FRONTEND_UUID: ${{ vars.COOLIFY_FRONTEND_UUID }}
      WATCHTRACE_PUBLIC_URL: ${{ vars.WATCHTRACE_PUBLIC_URL }}
      FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/watchtrace-console
    steps:
      - name: Check out the tested deployment helper
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Download immutable frontend-image digest
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: production-digest-watchtrace-console
          path: .release

      - name: Validate production deployment configuration
        run: |
          for variable_name in COOLIFY_API_URL COOLIFY_TOKEN COOLIFY_FRONTEND_UUID WATCHTRACE_PUBLIC_URL; do
            eval "variable_value=\${$variable_name:-}"
            if [ -z "$variable_value" ]; then
              echo "$variable_name must be configured for the prod environment."
              exit 1
            fi
          done
          test -s .release/watchtrace-console.digest

      - name: Inspect current frontend release
        id: inspect_frontend
        run: ./scripts/coolify-deploy.sh inspect-image "$COOLIFY_FRONTEND_UUID" "$FRONTEND_IMAGE"

      - name: Deploy frontend only
        id: deploy_frontend
        run: |
          ./scripts/coolify-deploy.sh deploy-image \
            "$COOLIFY_FRONTEND_UUID" "$FRONTEND_IMAGE" \
            "$(tr -d '\r\n' < .release/watchtrace-console.digest)"

      - name: Run public production acceptance checks
        run: ./scripts/verify-production-deployment.sh "$WATCHTRACE_PUBLIC_URL"

      - name: Create production release record
        env:
          PREVIOUS_REFERENCE: ${{ steps.inspect_frontend.outputs.current_reference }}
          FRONTEND_REFERENCE: ${{ steps.deploy_frontend.outputs.deployed_reference }}
          DEPLOYMENT_UUID: ${{ steps.deploy_frontend.outputs.deployment_uuid }}
        run: |
          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg commit "$GITHUB_SHA" \
            --arg workflow_run "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --arg timestamp "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg previous "$PREVIOUS_REFERENCE" \
            --arg current "$FRONTEND_REFERENCE" \
            --arg deployment "$DEPLOYMENT_UUID" \
            '{repository:$repository,commit:$commit,workflow_run:$workflow_run,timestamp:$timestamp,environment:"prod",image:{previous:$previous,current:$current},coolify_deployment:$deployment}' \
            > production-release.json

      - name: Retain production release record
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-production-release-${{ github.sha }}
          path: production-release.json
          if-no-files-found: error
          retention-days: 90
